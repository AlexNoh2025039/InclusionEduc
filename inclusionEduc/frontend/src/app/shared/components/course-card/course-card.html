<div class="course-card" (click)="onSelect()">
    <div class="image-container" *ngIf="course?.imageUrl">
        <img [src]="course.imageUrl" [alt]="course.title" />
    </div>
    <div class="card-content">
        <span class="badge" *ngIf="course?.category">{{ course.category }}</span>
        <h3>{{ course?.title }}</h3>
        <p>{{ course?.description }}</p>
        <a *ngIf="course?.videoUrl" [href]="course.videoUrl" target="_blank" rel="noopener noreferrer">
            Ver vídeo del curso
        </a>
        <a *ngIf="course?.pdfData" [href]="course.pdfData" [download]="course.pdfName ?? 'documento.pdf'">
            Descargar PDF
        </a>

        <div class="progress-bar" *ngIf="course?.progress !== undefined">
            <div class="progress" [style.width.%]="course.progress"></div>
        </div>
    </div>
</div>
