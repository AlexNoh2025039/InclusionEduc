<div class="login-card">
    <h2>{{ isRegisterMode ? 'Crear cuenta' : 'Iniciar Sesión' }}</h2>

    @if (isRegisterMode) {
    <form data-form="register" (ngSubmit)="register()">
        <div class="form-group">
            <label for="name">Nombre completo</label>
            <input type="text" id="name" [(ngModel)]="name" name="name" required placeholder="Tu nombre" />
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" [(ngModel)]="email" name="email" required placeholder="ejemplo@correo.com" />
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" [(ngModel)]="password" name="password" required
                placeholder="••••••••" />
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirmar contraseña</label>
            <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" required
                placeholder="••••••••" />
        </div>

        <button type="submit" [disabled]="isSubmitting">{{ isSubmitting ? 'Creando...' : 'Crear cuenta' }}</button>
    </form>
    } @else {
    <form (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" [(ngModel)]="email" name="email" required placeholder="ejemplo@correo.com" />
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" [(ngModel)]="password" name="password" required
                placeholder="••••••••" />
        </div>

        <button type="submit" [disabled]="isSubmitting">{{ isSubmitting ? 'Iniciando...' : 'Ingresar' }}</button>
    </form>
    }

    @if (errorMessage) {
    <p class="error-message" role="alert">{{ errorMessage }}</p>
    }

    <p class="register-link" *ngIf="!isRegisterMode">
        ¿No tienes una cuenta?
        <button type="button" data-action="show-register" (click)="showRegister()">Registrarse</button>
    </p>
    <button *ngIf="isRegisterMode" type="button" class="back-link" (click)="showLogin()">Volver al inicio</button>
</div>
